[project]
name = "lantu"
version = "0.2.0"
description = "A terminal AI coding assistant"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "rich>=13.9.0",
    "prompt-toolkit>=3.0.48",
    "filelock>=3.16.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
lantu = "lantu.__main__:main"

[project.optional-dependencies]
capture = ["mitmproxy>=11.0.2"]

[tool.hatch.build.targets.wheel]
packages = ["lantu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pexpect>=4.9.0",
]
